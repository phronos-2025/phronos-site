<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ouroboros - Light Mode (Transparent Background) -->
  <!-- For documents and headers -->

  <!-- Serpent Body: Circle with gap, centered at (256,256), r=176 -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#1A1A1A" stroke-width="40" stroke-linecap="round" stroke-dasharray="1016 88" transform="rotate(-32 256 256)"/>

  <!-- Serpent Head at 1 o'clock position -->
  <circle cx="344" cy="104" r="44.8" fill="#1A1A1A"/>

  <!-- Eye (Gold) -->
  <circle cx="344" cy="104" r="17.6" fill="#B08D55"/>

  <!-- Outer pulsing ring - centered, equidistant from serpent and core -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#B08D55" stroke-width="16" opacity="0.4"/>

  <!-- Core Center (Gold) -->
  <circle cx="256" cy="256" r="32" fill="#B08D55"/>
</svg>
